notes: >-
  Completed Uniform Residential Loan Application (Freddie Mac Form 65 / Fannie Mae Form
  1003, 1/2021), 8 pages, text layer; redact.py. Heavily personal: borrower name, SSN,
  date of birth, phones, email, current address, dependents' ages, employer name,
  address and phone, start date, the lender loan number/ULI, property address, and
  signatures. Replace the employer too (with position and start date it identifies the
  borrower). The url is deliberately the ID-only Scribd link: the full Scribd URL and
  the downloaded filename carry the borrower's name, so neither may appear anywhere in
  the repo. Suggested fields: impersonal ones such as the loan amount, loan purpose,
  occupancy, property value, or the gross monthly income figures. Scribd is a user-
  upload site, not a publisher: treat this as a personal record. Clearance must be
  redacted. Redact before parsing, with the rules file kept in the scratchpad. Replace
  people's names and addresses, government and tax IDs, and account, loan, case, claim,
  order and reference numbers (use plausible.py). Also replace dates of birth, VINs,
  wallet addresses and property addresses. Redraw or remove signatures, and remove
  barcodes that encode mailing data. Keep government bodies, courts, banks, lenders and
  service providers. Name the source file <slug>.pdf, never the Scribd filename. Do not
  record the uploader. Feature impersonal fields only (amounts, dates, codes,
  checkboxes, organizations). Before parsing, pause and show the operator the redacted
  first page.
