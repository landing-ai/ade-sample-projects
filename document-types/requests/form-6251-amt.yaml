notes: >-
  Publisher: Internal Revenue Service, MeF Assurance Testing System (ATS) Test Scenario 13
  for tax year 2025. Provenance: listed on
  https://www.irs.gov/e-file-providers/tax-year-2025-form-1040-series-and-extensions-modernized-e-file-mef-assurance-testing-system-ats-information
  US government work, public domain.
  Use pages 5-6 only, Form 6251 (2025); split them out on their own. Page 6 (Part III) is
  blank. The same document supplies the form-1040 request (pages 2-3).
  Text layer; every value is IRS test data (fictitious taxpayer, SSNs in the ATS test range
  400-00-13xx), so no redaction should be needed.
  The AMT result is zero: alternative minimum taxable income is below the exemption. The
  operator accepted that. Only about 8 lines are filled, and there is no checkbox.
  Suggested feature page 1 of the split (page 5 of the source), telling AMTI, then
  exemption, then regular tax, then AMT: tax year, line 4 AMTI, line 5 exemption, line 10
  regular tax, line 11 AMT. Suggestions only.
  Layout risk: line 1a's value sits in an inner column, left of the main amount column.
  The IRS may replace this undated file in place, so keep the downloaded copy.
