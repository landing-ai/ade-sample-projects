name: Allonge to Note
url: https://oregonsheriffssales.org/wp-content/uploads/2025/01/384277-Writ.pdf

# Anything the skill should know that the document does not say.
notes: >-
  Use page 12 only, the Allonge to Note with a specific endorsement (pay to the order of PennyMac Loan Services, LLC, without recourse, PennyMac Corp.). Split it out on its own; do not use the full document or page 13, the second allonge, which is a blank endorsement.
  The source is a 13-page scanned Oregon foreclosure sale packet (no text layer) published on the Oregon sheriffs' sales site. It names private individuals (the deceased borrower and his heirs) and the property address, so expect clearance redacted. The scan is raster, so neither redact.py nor redact_outlined.py can replace its text: add a pixel-level redaction mode. Use the same stand-ins across allonge-to-note, promissory-note, writ-of-execution and foreclosure-judgment so the four samples agree with each other; whichever runs first sets them. The filer already blacked out the loan, case and MIN numbers before scanning; keep those blackouts as they are.
