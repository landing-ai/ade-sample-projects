# Copy this to document-types/requests/<slug>.yaml and fill in what you know.
#
# Only `name` and `url` are required. Everything else is optional, and leaving
# a field out means the skill decides it, exactly as it did before request
# files existed.
#
# Run it with:   /new-document-type-assets document-types/requests/<slug>.yaml

name: Rate Lock
