name: SBA Form 413
url: https://www.scribd.com/document/567494949/completed-sba-form-413

# Downloaded by hand by the operator on 2026-10-03.
file: ~/Downloads/567494949-completed-sba-form-413.pdf

# Anything the skill should know that the document does not say.
notes: >-
  Completed SBA Form 413 Personal Financial Statement (05-21 edition), 6 pages, text
  layer; redact.py. Personal data: applicant name, business name, home and business
  addresses, phones, any SSN, real-estate addresses, account and loan numbers, and the
  signature. Page 1 is instructions; feature the page with the assets and liabilities
  totals. Suggested fields: the program checkbox (7(a)), total assets, total
  liabilities, net worth. Scribd is a user-upload site, not a publisher: treat this as a
  personal record. Clearance must be redacted. Redact before parsing, with the rules
  file kept in the scratchpad. Replace people's names and addresses, government and tax
  IDs, and account, loan, case, claim, order and reference numbers (use plausible.py).
  Also replace dates of birth, VINs, wallet addresses and property addresses. Redraw or
  remove signatures, and remove barcodes that encode mailing data. Keep government
  bodies, courts, banks, lenders and service providers. Name the source file <slug>.pdf,
  never the Scribd filename. Do not record the uploader. Feature impersonal fields only
  (amounts, dates, codes, checkboxes, organizations). Before parsing, pause and show the
  operator the redacted first page.
