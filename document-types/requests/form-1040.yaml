notes: >-
  Added by the operator to the batch: the 2025 Form 1040 from the same IRS document as the
  form-6251-amt request. Publisher: Internal Revenue Service, MeF Assurance Testing System
  (ATS) Test Scenario 13 for tax year 2025. Provenance: listed on
  https://www.irs.gov/e-file-providers/tax-year-2025-form-1040-series-and-extensions-modernized-e-file-mef-assurance-testing-system-ats-information
  US government work, public domain.
  Use pages 2-3 only, Form 1040 (2025) pages 1 and 2; split them out on their own.
  Text layer; every value is IRS test data (a fictitious married-filing-jointly couple at
  13 ELM STREET, ANYTOWN TX, SSNs in the ATS test range), so no redaction should be needed.
  Checkboxes are filled: filing status (married filing jointly) and the digital-assets
  question (No). Both are candidates to feature beside the income lines.
  The pages carry a 'TREASURY/IRS AND OMB USE ONLY DRAFT' header and 'DRAFT - DO NOT FILE'
  side banners, which may appear in the parse. The Form 6251 pages do not have them.
