name: Power of Attorney
url: https://drive.google.com/file/d/1HBbJsyyhp90pAaS4sYdq-nokH1f25BeW/view

# Anything the skill should know that the document does not say.
notes: >-
  Publisher: Ocrolus. Provenance: https://docs.ocrolus.com/docs/power-of-attorney links this
  exact Google Drive file as its Power of Attorney sample. Ocrolus is a document-AI vendor,
  so this is a competitor's published sample, accepted by the operator.
  One page: a lender's corporate power of attorney appointing an agent to endorse, assign
  and deliver promissory notes and mortgage rights. Every value is specimen ('Fake Mortgage
  Company', 'Sample Financial Services, Inc.', fake addresses, specimen script signatures
  for the signer and the notary), so no redaction should be needed.
  Mixed layer: the body is vector outlines (about 3,300 paths) and only the filled-in values
  are text. Download through Drive's standard link (uc?export=download&id=...).
  Suggested fields, all on page 1: principal (the lender), agent, execution date, notary
  state and county with the acknowledgment date, and notary commission expiry; a
  signed / notarized flag is a plus. Suggestions only.
  Layout risk: the signature area is two columns, with the signing principal on the left
  and an empty agent signature block on the right. Side-by-side signature blocks
  cross-paired on the bailee letter. The execution and notary dates are split across
  separate blanks.
