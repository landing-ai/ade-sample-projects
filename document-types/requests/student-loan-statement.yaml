name: Student Loan Statement
url: https://www.scribd.com/document/693402713/ViewFile-12

# Downloaded by hand by the operator on 2026-10-03.
file: ~/Downloads/693402713-ViewFile-12.pdf

# Anything the skill should know that the document does not say.
notes: >-
  New Zealand Inland Revenue (StudyLink) Student Loan Statement, 3 pages, text layer;
  redact.py. Note it is a New Zealand government statement, not a US servicer statement;
  say so in the README. Personal data: borrower name and postal address, IRD number, a
  reference number, a mailing barcode. Suggested fields: rows of the 'Increases to your
  loan' and 'Decreases to your loan' tables and the current loan balance. Scribd is a
  user-upload site, not a publisher: treat this as a personal record. Clearance must be
  redacted. Redact before parsing, with the rules file kept in the scratchpad. Replace
  people's names and addresses, government and tax IDs, and account, loan, case, claim,
  order and reference numbers (use plausible.py). Also replace dates of birth, VINs,
  wallet addresses and property addresses. Redraw or remove signatures, and remove
  barcodes that encode mailing data. Keep government bodies, courts, banks, lenders and
  service providers. Name the source file <slug>.pdf, never the Scribd filename. Do not
  record the uploader. Feature impersonal fields only (amounts, dates, codes,
  checkboxes, organizations). Before parsing, pause and show the operator the redacted
  first page.
