# Copy this to document-types/requests/<slug>.yaml and fill in what you know.
#
# Only `name` and `url` are required. Everything else is optional, and leaving
# a field out means the skill decides it, exactly as it did before request
# files existed.
#
# Run it with:   /new-document-type-assets document-types/requests/<slug>.yaml

name: Commitment for Title Insurance
url: https://adc-tenbox-prod.imgix.net/resi/propertyDocuments/1300098/PRELIMINARY_TITLE_REPORT/40C02EC5FCCE4D3BBF40A5C6B9BEF65F.v1.pdf

# A local copy, for sites that block scripted downloads (Scribd and similar).
# The url above is still required: it is the source of record and goes on the
# published page.
# file: ~/Downloads/bol.pdf

# An existing schema to use unchanged. A schema the team already runs beats a
# new one written for the sample. Omit this and one gets written.
# schema: ~/schemas/bill-of-lading.json

# Which page the worked example features. Omit and the skill picks the page
# where the best-grounded fields are.
feature_page: 1

# The values you want shown beside the page overlay, 3 to 5, all on one page.
# Omit and the skill picks them.
#
# These are a request, not an instruction. Three failure modes are invisible
# until after the ADE run: a value can be synthesized with no coordinates at
# all, grounded to text that supports it without containing it, or grounded on
# a different page. If a field you asked for turns out to be any of those, the
# skill stops and tells you, with the nearest usable alternatives. It does not
# quietly substitute.
#fields:


# Anything the skill should know that the document does not say.
notes: include as one of the featured fields a boolean to say if the document is signed and a boolean to say if the document carries a seal or stamp
