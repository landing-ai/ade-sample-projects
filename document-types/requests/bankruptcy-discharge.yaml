file: ~/Downloads/489929789-Discharging-Debtor-7-Trustee-Closing-Case-Auto-Part-1.pdf

# Anything the skill should know that the document does not say.
notes: >-
  US Bankruptcy Court, District of South Carolina, Chapter 7 order discharging the
  debtor and trustee and closing the case (Form 18 family), 2 pages, text layer;
  redact.py. Personal data: debtor names including aka/fka aliases, home address, last
  four of the SSN, and the case number (repeated in the ECF header line). The judge and
  the clerk appear in official capacity; keep their printed names but replace the
  judge's signature image. Suggested fields: the chapter, the court, the discharge/entry
  date, and the statute cited. Scribd is a user-upload site, not a publisher: treat this
  as a personal record. Clearance must be redacted. Redact before parsing, with the
  rules file kept in the scratchpad. Replace people's names and addresses, government
  and tax IDs, and account, loan, case, claim, order and reference numbers (use
  plausible.py). Also replace dates of birth, VINs, wallet addresses and property
  addresses. Redraw or remove signatures, and remove barcodes that encode mailing data.
  Keep government bodies, courts, banks, lenders and service providers. Name the source
  file <slug>.pdf, never the Scribd filename. Do not record the uploader. Feature
  impersonal fields only (amounts, dates, codes, checkboxes, organizations). Before
  parsing, pause and show the operator the redacted first page.
