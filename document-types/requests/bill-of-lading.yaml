# Anything the skill should know that the document does not say.
notes: >-
  A genuine COSCO Container Lines port-to-port / combined transport bill of lading (B/L
  COSU6030603280, issued Beihai 23 May 2011, Beihai to New York, place of delivery
  Buffalo), filed as deposition Exhibit 8 within ECF 46-7 (Rule 56.1 statement) in Fubon
  Ins. Co. Ltd. v. OHL International, S.D.N.Y.; served by the RECAP archive
  (CourtListener docket 4350849, entry 46, attachment 7). The CourtListener HTML page
  answers scripts with 403, but the RECAP storage path itself encodes the court, case and
  document. Clearance expected: public (a public court record; every party is a company).
  The PDF is 21 pages; use pages 2-3 only (page 2 the B/L face, page 3 the rider 'PAGE 2
  OF 2' with OCEAN FREIGHT PREPAID). Page 1 is an exhibit slip sheet; pages 4 onward are
  COSCO's B/L terms and an unrelated service contract. Raster scan from an office copier,
  no text layer. Personal data: none on the B/L itself, but a deposition exhibit sticker
  in the Freight & Charges box carries a witness's handwritten surname and a date: mask
  the sticker (redact_scan.py --erase, or a plain fill) and record it as the only
  redaction; clearance then becomes 'redacted' by the skill's rule if any change is
  made, so say which in the manifest. Fabrication checks done in research: container
  CBHU1842324 passes ISO 6346 and CBHU is COSCO's own prefix; producer is a Canon
  copier. Use the schema unchanged; report any field it requires that the B/L lacks.
  Suggested fields, as suggestions only: B/L number, vessel and voyage, port of loading,
  port of discharge, container number, gross weight. Dates print as '23 MAY 2011' and
  will likely ground OFF. The seal number is partly overstruck; do not feature it. The
  container/seal cell pairs two values with a slash.
