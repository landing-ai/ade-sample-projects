# Copy this to document-types/requests/<slug>.yaml and fill in what you know.
#
# Only `name` and `url` are required. Everything else is optional, and leaving
# a field out means the skill decides it, exactly as it did before request
# files existed.
#
# Run it with:   /new-document-type-assets document-types/requests/<slug>.yaml
#
# Source found on Scribd by the operator on 2026-10-03 and downloaded by hand.
# The website must show this URL as plain text, not as a link.

name: Flood Certification
url: https://www.scribd.com/document/671333520/Flood-Certificate

# Downloaded by hand by the operator on 2026-10-03.
file: ~/Downloads/671333520-Flood-Certificate.pdf

# Anything the skill should know that the document does not say.
notes: >-
  FEMA Standard Flood Hazard Determination Form (FF-206-FY-21-116) prepared by
  ServiceLink National Flood, 3 pages, text layer; redact.py. Personal data: borrower
  name, property address, customer number, loan identifier, order number. Keep the
  lender (a bank), ServiceLink and FEMA. Suggested fields: NFIP community name and
  number, map panel number and effective date, flood zone, the 'NO' special flood hazard
  area checkbox, the determination date. Scribd is a user-upload site, not a publisher:
  treat this as a personal record. Clearance must be redacted. Redact before parsing,
  with the rules file kept in the scratchpad. Replace people's names and addresses,
  government and tax IDs, and account, loan, case, claim, order and reference numbers
  (use plausible.py). Also replace dates of birth, VINs, wallet addresses and property
  addresses. Redraw or remove signatures, and remove barcodes that encode mailing data.
  Keep government bodies, courts, banks, lenders and service providers. Name the source
  file <slug>.pdf, never the Scribd filename. Do not record the uploader. Feature
  impersonal fields only (amounts, dates, codes, checkboxes, organizations). Before
  parsing, pause and show the operator the redacted first page.
